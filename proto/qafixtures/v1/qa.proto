syntax = "proto3";

package qafixtures.v1;

option go_package = "github.com/ClaudioSchirmer/omnicore-example-users/proto/gen/qafixturesv1";

import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "omnicore/v1/query.proto";

// QAService is the qa-only gRPC fixture surface (//go:build qa consumers
// only — invisible to the canonical binary): Provoke drives the FULL
// Semantic→code table through a real dispatch; ListGadgets exercises the
// COMPLETE StringOp vocabulary over the shared omnicore.v1 components
// against the qa Gadget view; FlakyEcho and Boom are transport fixtures
// (raw-mounted) feeding the grpcclient's deterministic retry, idempotency
// and circuit-breaker e2e checks.
service QAService {
  rpc Provoke(ProvokeRequest) returns (ProvokeResponse);
  rpc ListGadgets(ListGadgetsRequest) returns (ListGadgetsResponse);
  // ListGadgetsRel is ListGadgets against the RelationalSource twin of the same
  // root (view gadgets_rel, served from the SoR instead of the Mongo
  // projection). Same request/response messages — nothing about the WIRE
  // changes when the view's backing does, which is the point: it proves the
  // gRPC list envelope (PaginationInfo, the REST pagination block mirrored) is filled identically from a
  // relationally served page.
  rpc ListGadgetsRel(ListGadgetsRequest) returns (ListGadgetsResponse);
  // ListGadgetsBare binds the same request message to a Request DTO with NO
  // reserved control keys — the reserved-gate proof: every control set on
  // the wire rejects INVALID_ARGUMENT; filters keep working.
  rpc ListGadgetsBare(ListGadgetsRequest) returns (ListGadgetsResponse);
  rpc FlakyEcho(FlakyEchoRequest) returns (FlakyEchoResponse);
  rpc Boom(BoomRequest) returns (BoomResponse);
  rpc EchoTypes(EchoTypesRequest) returns (EchoTypesResponse);
}

// ProvokeRequest names the NotificationSemantic to emit: validation,
// schema, not_found, conflict, state_conflict, forbidden, unauthorized,
// unavailable, method_not_allowed, payload_too_large, gateway_timeout —
// or "internal" (a plain error through the exception path).
message ProvokeRequest {
  optional string semantic = 1;
}

message ProvokeResponse {}

message GadgetFilters {
  omnicore.v1.StringFilter name = 1;
  omnicore.v1.StringFilter code = 2;
  omnicore.v1.StringFilter category = 3;
  omnicore.v1.StringFilter status = 4;
}

message ListGadgetsRequest {
  omnicore.v1.PaginationRequest pagination = 1;
  repeated omnicore.v1.OrderByField order_by = 2;
  google.protobuf.FieldMask fields = 3;
  GadgetFilters filters = 4;
}

message Gadget {
  string id = 1;
  string code = 2;
  string name = 3;
  string category = 4;
  string status = 5;
}

message ListGadgetsResponse {
  repeated Gadget items = 1;
  omnicore.v1.PaginationInfo pagination = 2;
}

message FlakyEchoRequest {
  optional string key = 1;
  optional int32 fail_times = 2;
}

message FlakyEchoResponse {
  int32 attempts = 1;
  int32 distinct_keys = 2;
}

message BoomRequest {}

message BoomResponse {}

// ─── EchoTypes: the WIRE-TYPE matrix ────────────────────────────────────────
//
// Every proto scalar kind in ONE command, echoed back, so grpc.sh proves the
// pb↔DTO bridge per kind in BOTH directions over a real connection against
// the SAME DTO shapes REST binds. The 64-bit integers are the pair the two
// JSON dialects disagree on (the proto3 JSON mapping quotes them,
// encoding/json does not) — priceCents is the money shape that disagreement
// used to break. sumCents is computed IN THE HANDLER, so a green case proves
// the value arrived as a NUMBER the domain can do arithmetic on, not as text.

enum Flavor {
  FLAVOR_UNSPECIFIED = 0;
  FLAVOR_SWEET = 1;
  FLAVOR_SALTY = 2;
}

message EchoTypesChild {
  int64 child_cents = 1;
  string child_label = 2;
}

message EchoTypesRequest {
  optional int64 price_cents = 1;
  optional sint64 signed_delta = 2;
  optional sfixed64 fixed_signed = 3;
  optional uint64 huge_count = 4;
  optional fixed64 fixed_unsigned = 5;
  optional int32 quantity = 6;
  optional uint32 unsigned_quantity = 7;
  optional double weight = 8;
  optional float ratio = 9;
  optional bool active = 10;
  optional string label = 11;
  optional bytes payload = 12;
  optional Flavor flavor = 13;
  google.protobuf.Timestamp occurred_at = 14;
  repeated int64 amounts = 15;
  repeated string tags = 16;
  EchoTypesChild child = 17;
  repeated EchoTypesChild children = 18;
}

message EchoTypesResponse {
  int64 price_cents = 1;
  sint64 signed_delta = 2;
  sfixed64 fixed_signed = 3;
  uint64 huge_count = 4;
  fixed64 fixed_unsigned = 5;
  int32 quantity = 6;
  uint32 unsigned_quantity = 7;
  double weight = 8;
  float ratio = 9;
  bool active = 10;
  string label = 11;
  bytes payload = 12;
  Flavor flavor = 13;
  google.protobuf.Timestamp occurred_at = 14;
  repeated int64 amounts = 15;
  repeated string tags = 16;
  EchoTypesChild child = 17;
  repeated EchoTypesChild children = 18;
  // sum_cents = price_cents + Σ amounts + Σ children.child_cents, computed
  // by the handler on the BOUND values.
  int64 sum_cents = 19;
  // label_present distinguishes an absent optional from an empty string —
  // the presence contract the bridge must preserve.
  bool label_present = 20;
}
