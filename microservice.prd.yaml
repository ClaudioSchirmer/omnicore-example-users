service: omnicore-example-users

http:
  addr: "${HTTP_ADDR::8080}"

grpc:
  addr: "${GRPC_ADDR::9090}"

relational:
  dialect: "${REL_DIALECT:postgres}"
  dsn: "${DATABASE_URL:postgres://omnicore:omnicore@localhost:5433/users_db?sslmode=disable}"

mongo:
  uri: "${MONGO_URI:mongodb://localhost:27018}"
  database: "${MONGO_DB:users_views}"
  # autoRun: true is the sandbox posture so QA suites can boot under prd
  # without the strict-mode drift abort. The profile-aware default in non-dev
  # profiles is check — real services running this profile against production
  # Mongo would either keep autoRun: true (auto-rebuild on deploy) or omit
  # the field entirely (operator runs the rebuild manually before redeploy).
  rebuild:
    autoRun: true

transport:
  endpoints:
    - "${TRANSPORT_ENDPOINTS:localhost:4222}"
  syncGroup: "${SYNC_GROUP_ID:omnicore-example-users-sync}"

migrations:
  dir: "${MIGRATIONS_DIR:./migrations/postgres}"
  autoRun: true

# Canonical prd profile. JWT validated locally against the IdP's JWKS endpoint —
# the most common production setup (low latency, key rotation honored on kid miss,
# no per-request IdP round-trip). The sibling profiles prd-pem.yaml,
# prd-external.yaml and prd-external-cached.yaml exercise the remaining modes of
# the framework's auth middleware and live next to this file so qa/auth.sh can
# select them via APP_PROFILE swap.
auth:
  mode: jwt
  jwt:
    algorithms: [RS256]
    issuer: "${JWT_ISSUER:http://localhost:8088/realms/omnicore-test}"
    audience: "${JWT_AUDIENCE:omnicore-users-api}"
    leewaySeconds: 5
    jwksUrl: "${JWT_JWKS_URL:http://localhost:8088/realms/omnicore-test/protocol/openid-connect/certs}"
  publicRoutes:
    - GET /livez
    - GET /readyz
  auditClaims:
    - preferred_username
    - email

# Audit destinations — production posture. Database guarantees the row is
# atomic with the data write (source of truth for compliance); slog feeds
# the operator's observability stack (ELK / Loki) as a read-side echo. Both
# active is the framework default; declared explicitly here so the production
# yaml carries no hidden assumptions about audit routing.
audit:
  destinations:
    - slog
    - database

  # Read surface over the audit trail, SERVED BY THE FRAMEWORK — no route, no
  # handler, no DTO in this service. Its presence is the switch.
  #
  # IT READS THE DATABASE. Every read answers from the audit_events table, so
  # `database` must stay among the destinations above; declaring this block
  # without it ABORTS the boot rather than mounting a surface that could only
  # ever answer an empty timeline. A deployment that routes audit only to slog
  # builds its own read surface over the log stream instead — the framework's
  # audit.RenderLabels / audit.RenderLabelsInJSON translate the field labels
  # there just the same, independent of where the events are stored.
  endpoint:
    renderLabels: true                   # default; false keeps the raw fieldLabelKey (machine consumers)
    maxLimit: 20                         # default; rows per timeline read (NOT inherited from query.maxLimit)
    rest:
      path: /audit                       # GET /audit/{entityType}/{aggregateId}[?first=N]
      permission: audit:read             # Layer-1 gate; inert until auth.authorization.enabled=true

# Cross-service integration events — defaults seeded; producer / subscriber
# entries land here when the service starts emitting or consuming events.
integration:
  defaults:
    consumerGroup: "${INTEGRATION_GROUP_ID:omnicore-example-users-integration}"
    workers: 4
    startFrom: latest

# Coordinated drain on SIGINT/SIGTERM (matches kubernetes
# terminationGracePeriodSeconds default).
shutdown:
  drainTimeoutSeconds: 30
